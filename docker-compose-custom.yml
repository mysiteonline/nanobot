x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - nanobot_data:/root/.nanobot

services:
  nanobot-gateway:
    <<: *common-config
    restart: unless-stopped
    ports:
      - "18790:18790"
      
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - CF_GATEWAY_TOKEN=${CF_GATEWAY_TOKEN}
      - GS_VISION_TOOL=${GS_VISION_TOOL}
      - GS_VISION_SECRET=${GS_VISION_SECRET}
      - CF_PROXY_BASE_URL=${CF_PROXY_BASE_URL}
      - CF_BRAVE_SEARCH_URL=${CF_BRAVE_SEARCH_URL}
      - CF_DYNAMIC_WORKER_URL=${CF_DYNAMIC_WORKER_URL}
      - CF_DYNAMIC_WORKER_SECRET=${CF_DYNAMIC_WORKER_SECRET}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - CF_BROWSER_TOKEN=${CF_BROWSER_TOKEN}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_USER_ID=${TELEGRAM_USER_ID}
      - TELEGRAM_USER_ID_2=${TELEGRAM_USER_ID_2}
      - TZ=${TZ:-Europe/Rome}

    entrypoint:
      - sh
      - -c
      - |
        # 1. INJECT NATIVE TOOLS (Max Efficiency)
        mkdir -p /app/nanobot/agent/tools/
        cat <<EOF > /app/nanobot/agent/tools/cloudflare_tools.py
        import os, httpx
        from typing import Any
        from nanobot.agent.tools.base import Tool

        class CloudflareEdgeTool(Tool):
            """Runs Python/JS code on Cloudflare Edge isolates."""
            @property
            def name(self) -> str: return "edge_compute"
            @property
            def description(self) -> str: return "PRIMARY for math/logic. Runs code on Cloudflare Edge."
            @property
            def parameters(self) -> dict[str, Any]:
                return {"type": "object", "properties": {"code": {"type": "string"}}, "required": ["code"]}
            async def execute(self, code: str, **kwargs) -> str:
                async with httpx.AsyncClient(timeout=30.0) as client:
                    resp = await client.post(os.environ["CF_DYNAMIC_WORKER_URL"], json={"code": code}, headers={"Authorization": f"Bearer {os.environ['CF_DYNAMIC_WORKER_SECRET']}"})
                    return resp.text[:8000]

        class CloudflareBrowserTool(Tool):
            """Fetches URL content as clean Markdown."""
            @property
            def name(self) -> str: return "web_md"
            @property
            def description(self) -> str: return "Visits a URL and extracts clean Markdown. Token-efficient."
            @property
            def parameters(self) -> dict[str, Any]:
                return {"type": "object", "properties": {"url": {"type": "string"}}, "required": ["url"]}
            async def execute(self, url: str, **kwargs) -> str:
                acc = os.environ["CF_ACCOUNT_ID"]
                target = f"https://api.cloudflare.com/client/v4/accounts/{acc}/browser-rendering/markdown"
                async with httpx.AsyncClient(timeout=60.0) as client:
                    resp = await client.post(target, json={"url": url}, headers={"Authorization": f"Bearer {os.environ['CF_BROWSER_TOKEN']}"})
                    return resp.text[:12000]
        EOF

        # 2. REGISTER NATIVE TOOLS
        touch /app/nanobot/agent/tools/__init__.py
        if ! grep -q "CloudflareEdgeTool" /app/nanobot/agent/tools/__init__.py; then
          echo "from .cloudflare_tools import CloudflareEdgeTool, CloudflareBrowserTool" >> /app/nanobot/agent/tools/__init__.py
        fi

        # 3. GENERATE MCP-READY CONFIG
        python -c '
        import os, json
        def env(k, d=""): return os.environ.get(k, d).strip()
        
        # Security: allowFrom logic from docs
        allowed = [x for x in [env("TELEGRAM_USER_ID"), env("TELEGRAM_USER_ID_2")] if x]
        if not allowed: allowed = ["*"] 

        c = {
            "agents": {
                "defaults": {
                    "model": env("GEMINI_MODEL"),
                    "timezone": env("TZ", "Europe/Rome"),
                    "restrictToWorkspace": False
                }
            },
            "providers": {
                "google": {
                    "apiKey": env("GEMINI_API_KEY"),
                    "apiBase": env("CF_PROXY_BASE_URL"),
                    "extraHeaders": {"cf-aig-authorization": f"Bearer {env(\"CF_GATEWAY_TOKEN\")}"}
                }
            },
            "tools": {
                "exec": {"enable": True},
                "mcpServers": {
                    # Example Stdio MCP (Requires npx in Docker)
                    "vps_files": {
                        "command": "npx",
                        "args": ["-y", "@modelcontextprotocol/server-filesystem", "/root/.nanobot"],
                        "enabledTools": ["read_file", "list_directory"]
                    }
                    # Example HTTP MCP (Token Efficient)
                    # "external_api": { "url": "https://mcp.example.com/sse" }
                },
                "web": {
                    "search": {
                        "provider": "brave",
                        "apiBase": env("CF_BRAVE_SEARCH_URL"),
                        "headers": {"cf-aig-authorization": f"Bearer {env(\"CF_GATEWAY_TOKEN\")}"}
                    }
                }
            },
            "channels": {
                "telegram": {
                    "enabled": True,
                    "token": env("TELEGRAM_TOKEN"),
                    "allowFrom": allowed
                }
            }
        }
        os.makedirs("/root/.nanobot", exist_ok=True)
        with open("/root/.nanobot/config.json", "w") as f: json.dump(c, f)
        '
        # 4. START WITH EXPLICIT CONFIG (MCP Requirement)
        exec nanobot gateway --config /root/.nanobot/config.json

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

volumes:
  nanobot_data:
    name: ${VOLUME_NAME:-nanobot-default-data}
    external: true
