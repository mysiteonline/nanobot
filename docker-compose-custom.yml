services:
  nanobot:
    build:
      context: .
      dockerfile: Dockerfile
    # ADD THIS LINE HERE
    user: root
    restart: unless-stopped
    ports:
      - "18790:18790"
    volumes:
      - nanobot_data:/root/.nanobot
      - ./entrypoint.py:/root/entrypoint.py
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_TARGET_ID=${TELEGRAM_TARGET_ID}
      - CF_GATEWAY_TOKEN=${CF_GATEWAY_TOKEN}
      - GS_VISION_TOOL=${GS_VISION_TOOL}
      - GS_VISION_SECRET=${GS_VISION_SECRET}
      - TZ=${TZ:-Europe/Rome}
    entrypoint: 
      - sh
      - -c
      - "chmod 644 /root/entrypoint.py && python3 /root/entrypoint.py"

volumes:
  nanobot_data:
    driver: local
