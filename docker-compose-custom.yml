x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - nanobot_data:/root/.nanobot

services:
  nanobot-gateway:
    <<: *common-config
    restart: unless-stopped
    ports:
      - "18790:18790"
      
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - CF_GATEWAY_TOKEN=${CF_GATEWAY_TOKEN}
      - GS_VISION_TOOL=${GS_VISION_TOOL}
      - GS_VISION_SECRET=${GS_VISION_SECRET}
      - CF_PROXY_BASE_URL=${CF_PROXY_BASE_URL}
      - CF_BRAVE_SEARCH_URL=${CF_BRAVE_SEARCH_URL}
      - CF_DYNAMIC_WORKER_URL=${CF_DYNAMIC_WORKER_URL}
      - CF_DYNAMIC_WORKER_SECRET=${CF_DYNAMIC_WORKER_SECRET}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - CF_BROWSER_TOKEN=${CF_BROWSER_TOKEN}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_USER_ID=${TELEGRAM_USER_ID}
      - TELEGRAM_USER_ID_2=${TELEGRAM_USER_ID_2}
      - TZ=${TZ:-Europe/Rome}

    entrypoint:
      - sh
      - -c
      - |
        # 1. INJECT NATIVE TOOLS
        # We place them in the standard tools directory so Nanobot auto-discovers them
        mkdir -p /app/nanobot/agent/tools/
        cat <<EOF > /app/nanobot/agent/tools/cloudflare_tools.py
        import os, httpx
        from typing import Any
        from nanobot.agent.tools.base import Tool

        class CloudflareEdgeTool(Tool):
            """PRIMARY. Isolated CF sandbox. Math/logic only. No VPS access."""
            def __init__(self):
                self.url = os.environ.get("CF_DYNAMIC_WORKER_URL")
                self.sec = os.environ.get("CF_DYNAMIC_WORKER_SECRET")
            @property
            def name(self) -> str: return "edge_compute"
            @property
            def description(self) -> str: return "Run Python/JS on Cloudflare Edge. Use for math and complex logic."
            @property
            def parameters(self) -> dict[str, Any]:
                return {
                    "type": "object",
                    "properties": {
                        "code": {"type": "string"},
                        "language": {"type": "string", "enum": ["python", "javascript"]}
                    },
                    "required": ["code"]
                }
            async def execute(self, code: str, language: str = "python", **kwargs) -> str:
                async with httpx.AsyncClient(timeout=30.0) as client:
                    resp = await client.post(self.url, json={"code": code, "language": language}, headers={"Authorization": f"Bearer {self.sec}"})
                    return resp.text

        class CloudflareBrowserTool(Tool):
            """Web reader. Returns Markdown. Max token efficiency."""
            def __init__(self):
                acc = os.environ.get("CF_ACCOUNT_ID")
                self.url = f"https://api.cloudflare.com/client/v4/accounts/{acc}/browser-rendering/markdown"
                self.tok = os.environ.get("CF_BROWSER_TOKEN")
            @property
            def name(self) -> str: return "web_md"
            @property
            def description(self) -> str: return "Visit URL and get clean Markdown content."
            @property
            def parameters(self) -> dict[str, Any]:
                return {"type": "object", "properties": {"url": {"type": "string"}}, "required": ["url"]}
            async def execute(self, url: str, **kwargs) -> str:
                async with httpx.AsyncClient(timeout=60.0) as client:
                    resp = await client.post(self.url, json={"url": url}, headers={"Authorization": f"Bearer {self.tok}"})
                    return resp.text
        EOF

        # 2. GENERATE LEAN CONFIG
        python -c '
        import os, json
        def env(k, d=""): 
            val = os.environ.get(k)
            return val.strip() if val else d

        tok = env("CF_GATEWAY_TOKEN")
        aig_h = {"cf-aig-authorization": f"Bearer {tok}"} if tok else {}

        c = {
            "providers": {
                "gemini": {"apiKey": env("GEMINI_API_KEY"), "apiBase": env("CF_PROXY_BASE_URL"), "extraHeaders": aig_h},
                "google": {"apiKey": env("GEMINI_API_KEY"), "apiBase": env("CF_PROXY_BASE_URL"), "extraHeaders": aig_h}
            },
            "agents": {"defaults": {"model": env("GEMINI_MODEL"), "timezone": env("TZ", "Europe/Rome")}},
            "tools": {
                "web": {
                    "search": {
                        "provider": "brave",
                        "apiBase": env("CF_BRAVE_SEARCH_URL"),
                        "headers": aig_h
                    }
                },
                "http": {
                    "vision_browser": {
                        "url": env("GS_VISION_TOOL"),
                        "method": "POST",
                        "headers": {"Content-Type": "application/json"},
                        "description": "Visual browser tool.",
                        "parameters": {
                            "type": "object",
                            "properties": {
                                "url": {"type": "string"},
                                "prompt": {"type": "string"},
                                "auth_token": {"type": "string", "const": env("GS_VISION_SECRET")}
                            },
                            "required": ["url", "auth_token"]
                        }
                    }
                },
                "shell": {"enabled": True}
            },
            "channels": {
                "telegram": {
                    "enabled": True,
                    "token": env("TELEGRAM_TOKEN"),
                    "allowFrom": [x for x in [env("TELEGRAM_USER_ID"), env("TELEGRAM_USER_ID_2")] if x]
                }
            }
        }
        os.makedirs("/root/.nanobot", exist_ok=True)
        with open("/root/.nanobot/config.json", "w") as f:
            json.dump(c, f)
        '
        exec nanobot gateway

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

volumes:
  nanobot_data:
    name: ${VOLUME_NAME:-nanobot-default-data}
    external: true
