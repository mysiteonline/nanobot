x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - nanobot_data:/root/.nanobot
    # Mount your existing file from Coolify Storage
    - ./entrypoint.py:/root/entrypoint.py

services:
  # INSTANCE 1: User A
  nanobot-user-a:
    <<: *common-config
    restart: unless-stopped
    ports: ["18790:18790"]
    environment: &common-env
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - CF_GATEWAY_TOKEN=${CF_GATEWAY_TOKEN}
      - GS_VISION_TOOL=${GS_VISION_TOOL}
      - GS_VISION_SECRET=${GS_VISION_SECRET}
      - INSTANCE_NAME=user_a
      - TARGET_ID=${TELEGRAM_USER_ID}
    entrypoint: ["python3", "/root/entrypoint.py"]

  # INSTANCE 2: User B
  nanobot-user-b:
    <<: *common-config
    restart: unless-stopped
    ports: ["18791:18791"]
    environment:
      <<: *common-env
      - INSTANCE_NAME=user_b
      - TARGET_ID=${TELEGRAM_USER_ID_2}
    entrypoint: ["python3", "/root/entrypoint.py"]

  # INSTANCE 3: Group A
  nanobot-group-a:
    <<: *common-config
    restart: unless-stopped
    ports: ["18792:18792"]
    environment:
      <<: *common-env
      - INSTANCE_NAME=group_a
      - TARGET_ID=${TELEGRAM_GROUP_ID}
    entrypoint: ["python3", "/root/entrypoint.py"]

volumes:
  nanobot_data:
    name: ${VOLUME_NAME:-nanobot-multi-instance}
    external: true
