services:
  nanobot-user-a:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "18790:18790"
    volumes:
      - nanobot_data:/root/.nanobot
      - ./entrypoint.py:/root/entrypoint.py
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - CF_GATEWAY_TOKEN=${CF_GATEWAY_TOKEN}
      - GS_VISION_TOOL=${GS_VISION_TOOL}
      - GS_VISION_SECRET=${GS_VISION_SECRET}
      - INSTANCE_NAME=user_a
      - TARGET_ID=${TELEGRAM_USER_ID}
      - TZ=${TZ:-Europe/Rome}
    entrypoint: ["python3", "/root/entrypoint.py"]

  nanobot-user-b:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "18791:18791"
    volumes:
      - nanobot_data:/root/.nanobot
      - ./entrypoint.py:/root/entrypoint.py
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - CF_GATEWAY_TOKEN=${CF_GATEWAY_TOKEN}
      - GS_VISION_TOOL=${GS_VISION_TOOL}
      - GS_VISION_SECRET=${GS_VISION_SECRET}
      - INSTANCE_NAME=user_b
      - TARGET_ID=${TELEGRAM_USER_ID_2}
      - TZ=${TZ:-Europe/Rome}
    entrypoint: ["python3", "/root/entrypoint.py"]

  nanobot-group-a:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "18792:18792"
    volumes:
      - nanobot_data:/root/.nanobot
      - ./entrypoint.py:/root/entrypoint.py
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - CF_GATEWAY_TOKEN=${CF_GATEWAY_TOKEN}
      - GS_VISION_TOOL=${GS_VISION_TOOL}
      - GS_VISION_SECRET=${GS_VISION_SECRET}
      - INSTANCE_NAME=group_a
      - TARGET_ID=${TELEGRAM_GROUP_ID}
      - TZ=${TZ:-Europe/Rome}
    entrypoint: ["python3", "/root/entrypoint.py"]

volumes:
  nanobot_data:
    name: ${VOLUME_NAME:-nanobot-multi-instance}
    external: true
