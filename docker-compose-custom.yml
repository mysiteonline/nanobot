x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - nanobot_data:/root/.nanobot

services:
  nanobot-gateway:
    <<: *common-config
    restart: unless-stopped
    ports:
      - "18790:18790"
    # Keep ALL your variables here so the bot can use them to write its own code
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - CF_GATEWAY_TOKEN=${CF_GATEWAY_TOKEN}
      - GS_VISION_TOOL=${GS_VISION_TOOL}
      - GS_VISION_SECRET=${GS_VISION_SECRET}
      - CF_PROXY_BASE_URL=${CF_PROXY_BASE_URL}
      - CF_BRAVE_SEARCH_URL=${CF_BRAVE_SEARCH_URL}
      - CF_DYNAMIC_WORKER_URL=${CF_DYNAMIC_WORKER_URL}
      - CF_DYNAMIC_WORKER_SECRET=${CF_DYNAMIC_WORKER_SECRET}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - CF_BROWSER_TOKEN=${CF_BROWSER_TOKEN}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_USER_ID=${TELEGRAM_USER_ID}
      - TELEGRAM_USER_ID_2=${TELEGRAM_USER_ID_2}
      - TZ=${TZ:-Europe/Rome}

    entrypoint:
      - sh
      - -c
      - |
        # Generate the basic config without any monkey-patching
        python -c '
        import os, json
        def env(k, d=""): return (os.environ.get(k) or d).strip()
        
        p_cfg = {
            "apiKey": env("GEMINI_API_KEY"),
            "apiBase": env("CF_PROXY_BASE_URL"),
            "extraHeaders": {"cf-aig-authorization": "Bearer " + env("CF_GATEWAY_TOKEN")}
        }

        c = {
            "providers": {"gemini": p_cfg, "google": p_cfg},
            "agents": {"defaults": {"model": env("GEMINI_MODEL"), "timezone": env("TZ")}},
            "tools": {
                "web": {"search": {"provider": "brave", "apiBase": env("CF_BRAVE_SEARCH_URL")}},
                "shell": {"enabled": True}
            },
            "channels": {
                "telegram": {"enabled": True, "token": env("TELEGRAM_TOKEN"), "allowFrom": [env("TELEGRAM_USER_ID"), env("TELEGRAM_USER_ID_2")]}
            }
        }
        os.makedirs("/root/.nanobot", exist_ok=True)
        with open("/root/.nanobot/config.json", "w") as f: json.dump(c, f)
        '
        exec nanobot gateway --config /root/.nanobot/config.json
