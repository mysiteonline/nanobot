x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - nanobot_data:/root/.nanobot

services:
  nanobot-gateway:
    <<: *common-config
    restart: unless-stopped
    ports:
      - "18790:18790"
      
    # Variables pulled from Coolify. No hardcoded data.
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - CF_GATEWAY_TOKEN=${CF_GATEWAY_TOKEN}
      - GS_VISION_TOOL=${GS_VISION_TOOL}
      - GS_VISION_SECRET=${GS_VISION_SECRET}
      - CF_PROXY_BASE_URL=${CF_PROXY_BASE_URL}
      - CF_BRAVE_SEARCH_URL=${CF_BRAVE_SEARCH_URL}
      - CF_DYNAMIC_WORKER_URL=${CF_DYNAMIC_WORKER_URL}
      - CF_DYNAMIC_WORKER_SECRET=${CF_DYNAMIC_WORKER_SECRET}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - CF_BROWSER_TOKEN=${CF_BROWSER_TOKEN}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_USER_ID=${TELEGRAM_USER_ID}
      - TELEGRAM_USER_ID_2=${TELEGRAM_USER_ID_2}
      - TZ=${TZ:-Europe/Rome}

    entrypoint:
      - sh
      - -c
      - |
        python -c '
        import os, json

        # 1. Clean Helper Function
        def env(k, d=""): 
            val = os.environ.get(k)
            return val.strip() if val else d

        # 2. Fetch Core Vars
        tok = env("CF_GATEWAY_TOKEN")
        aig_h = {"cf-aig-authorization": f"Bearer {tok}"} if tok else {}
        gemini_k = env("GEMINI_API_KEY")
        proxy = env("CF_PROXY_BASE_URL")

        # 3. Build Config
        c = {
            "providers": {
                "gemini": {"apiKey": gemini_k, "apiBase": proxy, "extraHeaders": aig_h},
                "google": {"apiKey": gemini_k, "apiBase": proxy, "extraHeaders": aig_h},
                "openrouter": {"apiKey": gemini_k}
            },
            "agents": {
                "defaults": {
                    "model": env("GEMINI_MODEL"),
                    "timezone": env("TZ", "Europe/Rome")
                }
            },
            "tools": {
                "web": {
                    "search": {
                        "provider": "brave",
                        "apiBase": env("CF_BRAVE_SEARCH_URL"),
                        "headers": aig_h
                    }
                },
                "edge_compute": {
                    "url": env("CF_DYNAMIC_WORKER_URL"),
                    "method": "POST",
                    "headers": {"Authorization": f"Bearer {env(\"CF_DYNAMIC_WORKER_SECRET\")}"},
                    "description": "PRIMARY. Isolated CF sandbox. Logic/math. No VPS access.",
                    "parameters": {
                        "type": "object",
                        "properties": {
                            "code": {"type": "string"},
                            "language": {"type": "string", "enum": ["javascript", "python"]}
                        },
                        "required": ["code"]
                    }
                },
                "web_md": {
                    "url": f"https://api.cloudflare.com/client/v4/accounts/{env(\"CF_ACCOUNT_ID\")}/browser-rendering/markdown",
                    "method": "POST",
                    "headers": {"Authorization": f"Bearer {env(\"CF_BROWSER_TOKEN\")}"},
                    "description": "Web reader. Returns Markdown. Max token efficiency.",
                    "parameters": {"type": "object", "properties": {"url": {"type": "string"}}, "required": ["url"]}
                },
                "vision_browser": {
                    "url": env("GS_VISION_TOOL"),
                    "method": "POST",
                    "headers": {"Content-Type": "application/json"},
                    "description": "Visual browser tool.",
                    "parameters": {
                        "type": "object",
                        "properties": {
                            "url": {"type": "string"},
                            "prompt": {"type": "string"},
                            "auth_token": {"type": "string", "const": env("GS_VISION_SECRET")}
                        },
                        "required": ["url", "auth_token"]
                    }
                },
                "shell": {
                    "provider": "shell",
                    "description": "FALLBACK. VPS files/system ONLY. Use if edge_compute fails."
                }
            },
            "channels": {
                "telegram": {
                    "enabled": True,
                    "token": env("TELEGRAM_TOKEN"),
                    "allowFrom": [x for x in [env("TELEGRAM_USER_ID"), env("TELEGRAM_USER_ID_2")] if x]
                }
            }
        }

        os.makedirs("/root/.nanobot", exist_ok=True)
        print("Writing secure config...")
        with open("/root/.nanobot/config.json", "w") as f:
            json.dump(c, f)
        '
        exec nanobot gateway

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
  
  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true

volumes:
  nanobot_data:
    name: ${VOLUME_NAME:-nanobot-default-data}
    external: true
