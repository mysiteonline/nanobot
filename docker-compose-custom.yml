x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - nanobot_data:/root/.nanobot
    # This matches the file you will create in the Coolify 'Storage' tab
    - ./gen_config.py:/root/gen_config.py

services:
  # INSTANCE 1: Personal Chat - User A
  nanobot-user-a:
    <<: *common-config
    restart: unless-stopped
    ports: ["18790:18790"]
    environment: &common-env
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - CF_GATEWAY_TOKEN=${CF_GATEWAY_TOKEN}
      - CF_PROXY_BASE_URL=${CF_PROXY_BASE_URL}
      - CF_BRAVE_SEARCH_URL=${CF_BRAVE_SEARCH_URL}
      - CF_DYNAMIC_WORKER_URL=${CF_DYNAMIC_WORKER_URL}
      - CF_DYNAMIC_WORKER_SECRET=${CF_DYNAMIC_WORKER_SECRET}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - CF_BROWSER_TOKEN=${CF_BROWSER_TOKEN}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TZ=${TZ:-Europe/Rome}
      - INSTANCE_NAME=user_a
      - TARGET_ID=${TELEGRAM_USER_ID}
    entrypoint: ["sh", "-c", "python3 /root/gen_config.py && exec nanobot gateway --config /root/.nanobot/user_a/config.json --port 18790"]

  # INSTANCE 2: Personal Chat - User B
  nanobot-user-b:
    <<: *common-config
    restart: unless-stopped
    ports: ["18791:18791"]
    environment:
      <<: *common-env
      - INSTANCE_NAME=user_b
      - TARGET_ID=${TELEGRAM_USER_ID_2}
    entrypoint: ["sh", "-c", "python3 /root/gen_config.py && exec nanobot gateway --config /root/.nanobot/user_b/config.json --port 18791"]

  # INSTANCE 3: Group Chat - group_a
  nanobot-group-a:
    <<: *common-config
    restart: unless-stopped
    ports: ["18792:18792"]
    environment:
      <<: *common-env
      - INSTANCE_NAME=group_a
      - TARGET_ID=${TELEGRAM_GROUP_ID}
    entrypoint: ["sh", "-c", "python3 /root/gen_config.py && exec nanobot gateway --config /root/.nanobot/group_a/config.json --port 18792"]

volumes:
  nanobot_data:
    name: ${VOLUME_NAME:-nanobot-multi-instance}
    external: true
